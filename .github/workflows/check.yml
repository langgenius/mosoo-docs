name: Check docs

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Documentation and OpenAPI check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Bun for canonical Mosoo OpenAPI
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Check canonical OpenAPI freshness
        run: npm run openapi:check

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run types:check

      - name: Build
        run: npm run build
