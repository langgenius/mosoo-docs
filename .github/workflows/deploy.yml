name: Deploy docs

on:
  push:
    branches:
      - main

concurrency:
  group: docs-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://mosoo.ai/docs/
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run types:check

      - name: Build
        run: npm run build

      - name: Deploy
        run: npm exec -- wrangler deploy --message "GitHub ${GITHUB_SHA}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test
        run: |
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
            https://mosoo.ai/docs/ --output /dev/null
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
            https://mosoo.ai/docs/llms.txt --output /dev/null
